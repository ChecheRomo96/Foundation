name: Native Build, Test, and Package

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 / Apple Clang / Arm64
            runner: macos-15
            preset: macos_arm64
            platform: unix
            compiler: c++

          - name: Ubuntu 24.04 / GCC / x64
            runner: ubuntu-24.04
            preset: linux_gcc_x64
            platform: unix
            compiler: g++

          - name: Ubuntu 24.04 / Clang / x64
            runner: ubuntu-24.04
            preset: linux_clang_x64
            platform: unix
            compiler: clang++

          - name: Ubuntu 24.04 / GCC / Arm64
            runner: ubuntu-24.04-arm
            preset: linux_gcc_arm64
            platform: unix
            compiler: g++

          - name: Ubuntu 24.04 / Clang / Arm64
            runner: ubuntu-24.04-arm
            preset: linux_clang_arm64
            platform: unix
            compiler: clang++

          - name: Windows 2025 / MSVC / x64
            runner: windows-2025-vs2026
            preset: windows_msvc_x64
            platform: windows
            compiler: msvc

          - name: Windows 2025 / Clang / x64
            runner: windows-2025-vs2026
            preset: windows_clang_x64
            platform: windows
            compiler: clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Unix toolchain
        if: matrix.platform == 'unix'
        shell: bash
        run: |
          set -eu
          cmake --version
          ninja --version
          "${{ matrix.compiler }}" --version
          uname -a

      - name: Verify Windows toolchain
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake --version
          ninja --version

          if ("${{ matrix.compiler }}" -eq "clang") {
              clang++ --version
          }
          else {
              $vswhere = Join-Path `
                  ${env:ProgramFiles(x86)} `
                  "Microsoft Visual Studio/Installer/vswhere.exe"
              & $vswhere -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                  -property installationVersion
          }

      - name: Test Debug
        if: matrix.platform == 'unix'
        shell: bash
        run: >-
          ./scripts/test.sh "${{ matrix.preset }}"
          --config Debug --fresh --parallel 4

      - name: Test Debug
        if: matrix.platform == 'windows'
        shell: pwsh
        run: >-
          ./scripts/test.ps1 "${{ matrix.preset }}"
          -Configuration Debug -Fresh -Parallel 4

      - name: Test Release
        if: matrix.platform == 'unix'
        shell: bash
        run: >-
          ./scripts/test.sh "${{ matrix.preset }}"
          --config Release --parallel 4

      - name: Test Release
        if: matrix.platform == 'windows'
        shell: pwsh
        run: >-
          ./scripts/test.ps1 "${{ matrix.preset }}"
          -Configuration Release -Parallel 4

      - name: Export and validate Release package
        if: matrix.platform == 'unix'
        shell: bash
        run: >-
          ./scripts/test-package.sh "${{ matrix.preset }}"
          --fresh --parallel 4

      - name: Export and validate Release package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: >-
          ./scripts/test-package.ps1 "${{ matrix.preset }}"
          -Fresh -Parallel 4

  sanitizers:
    name: Sanitizers / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 / GCC / x64
            runner: ubuntu-24.04
            preset: linux_gcc_x64

          - name: Ubuntu 24.04 / Clang / x64
            runner: ubuntu-24.04
            preset: linux_clang_x64

          - name: macOS 15 / Apple Clang / Arm64
            runner: macos-15
            preset: macos_arm64

    env:
      CXXFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test Debug with AddressSanitizer and UndefinedBehaviorSanitizer
        shell: bash
        run: >-
          ./scripts/test.sh "${{ matrix.preset }}"
          --config Debug --fresh --parallel 4
