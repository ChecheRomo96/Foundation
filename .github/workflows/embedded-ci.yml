name: Embedded Build and Package

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedded-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  avr:
    name: AVR-GCC / ATmega328P / AVR5
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install AVR toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gcc-avr binutils-avr avr-libc

      - name: Report toolchain
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          ninja --version
          avr-g++ --version
          uname -a

      - name: Build Debug
        uses: ./tools/RoModularBuild/actions/project-workflow
        with:
          command: build
          preset: atmega328p_avrgcc_avr5
          configuration: Debug
          target: Foundation
          fresh: true
          parallel: 4

      - name: Build Release
        uses: ./tools/RoModularBuild/actions/project-workflow
        with:
          command: build
          preset: atmega328p_avrgcc_avr5
          configuration: Release
          target: Foundation
          parallel: 4

      - name: Export and verify Release package identity
        shell: bash
        run: |
          set -euo pipefail
          preset=atmega328p_avrgcc_avr5

          ./scripts/export.sh "$preset" --fresh --parallel 4
          ./scripts/validate-package.sh "$preset"

      - name: Upload validated AVR package
        uses: actions/upload-artifact@v7
        with:
          name: Foundation-atmega328p_avrgcc_avr5
          path: dist/atmega328p_avrgcc_avr5
          if-no-files-found: error
          retention-days: 7

      - name: Upload AVR failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-avr-${{ github.run_attempt }}
          path: |
            build/atmega328p_avrgcc_avr5/CMakeCache.txt
            build/atmega328p_avrgcc_avr5/CMakeFiles/CMakeConfigureLog.yaml
            dist/atmega328p_avrgcc_avr5/
          if-no-files-found: warn
          retention-days: 14

  arduino:
    name: Arduino AVR / Uno source mode
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino AVR core
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8

      - name: Report toolchain
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli version
          arduino-cli core list

      - name: Compile every example sketch for Arduino Uno
        shell: bash
        run: ./scripts/test-arduino.sh

  arm:
    name: Arm GCC / Cortex-M profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Arm toolchain and runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Report toolchain
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          ninja --version
          arm-none-eabi-g++ --version
          arm-none-eabi-g++ -print-sysroot
          uname -a

      - name: Build, export, and verify every Arm package identity
        shell: bash
        run: |
          set -euo pipefail

          validate_profile() {
            preset=$1

            ./scripts/build.sh "$preset" \
              --config Debug --fresh --parallel 4 --target Foundation
            ./scripts/build.sh "$preset" \
              --config Release --parallel 4 --target Foundation
            ./scripts/export.sh "$preset" --fresh --parallel 4
            ./scripts/validate-package.sh "$preset"
          }

          for preset in \
            arm_none_eabi_cortex_m0plus_soft \
            arm_none_eabi_cortex_m3_soft \
            arm_none_eabi_cortex_m4f_hard \
            arm_none_eabi_cortex_m7f_hard \
            psoc5lp_armgcc_cortex_m3_soft \
            stm32f103_armgcc_cortex_m3_soft \
            stm32g0b1cbt6_armgcc_cortex_m0plus_soft \
            stm32f407_armgcc_cortex_m4f_hard \
            stm32h743_armgcc_cortex_m7f_hard
          do
            validate_profile "$preset"
          done

      - name: Link and inspect STM32G0B1 firmware consumer
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/test-stm32.sh \
            stm32g0b1cbt6_armgcc_cortex_m0plus_soft \
            --skip-export \
            --package dist/stm32g0b1cbt6_armgcc_cortex_m0plus_soft \
            --parallel 4

      - name: Upload validated Arm packages
        uses: actions/upload-artifact@v7
        with:
          name: Foundation-arm-none-eabi-packages
          path: |
            dist/arm_none_eabi_*
            dist/psoc5lp_*
            dist/stm32f103_*
            dist/stm32g0b1cbt6_*
            dist/stm32f407_*
            dist/stm32h743_*
            build/stm32-consumer/stm32g0b1cbt6_armgcc_cortex_m0plus_soft/Release/FoundationStm32G0B1Consumer.elf
            build/stm32-consumer/stm32g0b1cbt6_armgcc_cortex_m0plus_soft/Release/FoundationStm32G0B1Consumer.hex
            build/stm32-consumer/stm32g0b1cbt6_armgcc_cortex_m0plus_soft/Release/FoundationStm32G0B1Consumer.bin
            build/stm32-consumer/stm32g0b1cbt6_armgcc_cortex_m0plus_soft/Release/FoundationStm32G0B1Consumer.map
          if-no-files-found: error
          retention-days: 7

      - name: Upload Arm failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-arm-${{ github.run_attempt }}
          path: |
            build/*/CMakeCache.txt
            build/*/CMakeFiles/CMakeConfigureLog.yaml
            dist/arm_none_eabi_*/
            dist/psoc5lp_*/
            dist/stm32f103_*/
            dist/stm32g0b1cbt6_*/
            dist/stm32f407_*/
            dist/stm32h743_*/
            build/stm32-consumer/stm32g0b1cbt6_armgcc_cortex_m0plus_soft/
          if-no-files-found: warn
          retention-days: 14
